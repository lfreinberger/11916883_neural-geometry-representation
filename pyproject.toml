[project]
name = "neural-geometry"
version = "0.1.0"
description = "Neural signed distance representations of 2D shapes with local latent fields"
readme = "README.md"
authors = [
    { name = "Lukas Freinberger", email = "lukas.freinberger@tuwien.ac.at" }
]
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.8",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
