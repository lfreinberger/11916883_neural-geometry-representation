defaults:
  - _self_
  - model: baseline

experiment: neural-geometry
seed: 0
# validate on heldout and mpeg7_val every n training steps, 0 = only at the end
eval_every: 2000
# grid for chamfer, iou and topology, spacing 2 / (resolution - 1)
eval_resolution: 256

data:
  n_train: 400
  n_heldout: 50
  n_points: 2000
  n_points_val: 4000
  train_seed: 0
  heldout_seed: 1
  mpeg7_dir: data/mpeg7/original

# same loss for training, reconstruction and the spline reference
loss:
  delta: 0.1
  beta: 0.0

train:
  steps: 16000
  shapes_per_step: 64
  points_per_step: 256
  lr_decoder: 5.0e-4
  lr_codes: 5.0e-3
  init_std: 0.01
  lr_decay_at: 0.7
  lr_decay: 0.2

reconstruct:
  steps: 4000
  points_per_step: 1024
  lr_codes: 2.0e-2
  lr_decay_at: 0.7
  lr_decay: 0.2